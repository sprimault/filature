# Construction des binaires publiés, sur un tag.
#
# Une seule machine ne produit pas toutes les cibles, contrairement aux autres
# projets : Ebitengine ne se compile en croisé que vers Windows et WebAssembly,
# Linux et macOS exigent du natif. D'où la matrice multi-runners.
#
# Trois choses ne peuvent pas se faire cible par cible et vont dans le job de
# rassemblement : SHA256SUMS calculé en un seul endroit sur toutes les archives,
# l'attestation de provenance, et la création de la version.

name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire, pour un essai à blanc"
        required: true

permissions:
  contents: read

jobs:
  binaires:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # publier est posé sur chaque ligne, jamais laissé absent : une clé
          # manquante vaut null, que « != false » compare en convertissant les
          # deux en nombre — null et false valent zéro, donc la condition était
          # fausse partout et aucune archive n'était téléversée.
          - { os: windows, arch: amd64, cgo: 0, runner: ubuntu-latest, ext: .exe, publier: true }
          # js/wasm se compile mais ne se publie pas : l'archive serait
          # inutilisable seule, faute de wasm_exec.js et d'une page HTML, et le
          # mode web n'est pas au programme. La cible reste ici parce qu'elle est
          # ce qui empêche une dépendance d'introduire du cgo sans qu'on le voie.
          - { os: js, arch: wasm, cgo: 0, runner: ubuntu-latest, ext: .wasm, publier: false }
          - { os: linux, arch: amd64, cgo: 1, runner: ubuntu-latest, ext: "", publier: true }
          - { os: linux, arch: arm64, cgo: 1, runner: ubuntu-24.04-arm, ext: "", publier: true }
          - { os: darwin, arch: arm64, cgo: 1, runner: macos-latest, ext: "", publier: true }
          # macos-15-intel est la dernière image x86_64 des runners, annoncée
          # jusqu'en août 2027. Cette ligne a une date de péremption connue.
          - { os: darwin, arch: amd64, cgo: 1, runner: macos-15-intel, ext: "", publier: true }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "valeur=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "valeur=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # -trimpath toujours : les chemins absolus de la machine de build n'ont
      # rien à faire dans un artefact public.
      - name: Construction
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p paquet
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.valeur }}" \
            -o "paquet/filature${{ matrix.ext }}" ./cmd/filature

      # LICENSE et NOTICE vont dans l'archive et non à côté : Apache 2.0 les
      # exige à la redistribution, et personne ne télécharge un asset séparé.
      #
      # THIRD-PARTY-NOTICES pour la même raison, mais au titre des licences des
      # bibliothèques liées au binaire : la MIT, comme la plupart des licences
      # permissives, exige que sa notice accompagne toute copie du logiciel, et
      # un binaire qui la compile en est une.
      #
      # Rien d'autre : le contenu livré est embarqué dans le binaire, qui se
      # suffit donc à lui-même.
      - name: Archive
        shell: bash
        run: |
          cp LICENSE NOTICE THIRD-PARTY-NOTICES paquet/
          nom="filature_${{ steps.version.outputs.valeur }}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p dist
          cd paquet
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "../dist/$nom.zip" .
          else
            tar czf "../dist/$nom.tar.gz" .
          fi

      - uses: actions/upload-artifact@v7
        if: matrix.publier
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  rassemblement:
    name: Sommes, attestation et version
    needs: binaires
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # L'attestation lie chaque archive au commit et à la chaîne qui l'a
      # produite. C'est le seul contrepoids crédible à des binaires non signés.
      id-token: write
      attestations: write
    steps:
      # Le dépôt est nécessaire pour lire CHANGELOG.md : les notes de version
      # en sortent, plutôt que d'être collées à la main après coup — une étape
      # manuelle après publication est une étape qu'on oublie.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: recu
          merge-multiple: true

      # Les sommes portent sur les archives et non sur les binaires : c'est
      # l'archive que la personne télécharge, donc ce qu'elle peut vérifier.
      - name: SHA256SUMS
        run: |
          # Un dossier absent veut dire qu'aucun job de compilation n'a
          # téléversé son archive, et « cd: No such file or directory » ne le dit
          # pas — il faut alors remonter au job précédent pour comprendre. C'est
          # arrivé sur une condition de matrice qui valait faux partout.
          if [ ! -d recu ] || [ -z "$(ls -A recu)" ]; then
            echo "aucune archive reçue des jobs de compilation" >&2
            exit 1
          fi

          cd recu
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "recu/*.zip,recu/*.tar.gz"

      # Les notes viennent de la section du CHANGELOG qui porte cette version.
      # Elle a été relue en PR avant le tag, donc au moment où elle comptait :
      # c'est ce qui évite de la réécrire ici, où personne ne la relirait.
      #
      # Une section absente arrête la publication. Une version sans notes ne dit
      # ni ce qui change, ni ce qu'un auteur de plugin doit reprendre — ce que
      # les règles du projet exigent en tête.
      - name: Notes de version
        run: |
          # La même résolution que pour la version du binaire : sur un essai à
          # blanc, la référence est « master » et non un tag, et chercher une
          # section « [master] » faisait échouer l'étape que l'essai sert
          # justement à éprouver avant de taguer.
          version="${{ inputs.version }}"
          version="${version:-${GITHUB_REF_NAME#v}}"

          # index et non une expression régulière : les crochets du titre de
          # section y formeraient une classe de caractères, et « [0.1.1] »
          # correspondrait alors à un seul caractère parmi « 0 », « . » et
          # « 1 ». La recherche littérale ne pose pas la question.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { dedans = 1; next }
            dedans && index($0, "## ") == 1 { exit }
            dedans { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md n'a pas de section pour la version $version" >&2
            exit 1
          fi

          # Le titre est la troisième partie du titre de section, après la
          # version et la date. Absent, la version se nomme par son tag seul.
          titre=$(grep -m1 -F "## [$version]" CHANGELOG.md \
            | sed -n 's/^## \[[^]]*\][^—]*—[^—]*— *//p')
          if [ -n "$titre" ]; then
            echo "titre=${GITHUB_REF_NAME} — ${titre}" >> "$GITHUB_ENV"
          else
            echo "titre=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

          echo "== $titre =="
          cat notes.md

      # En brouillon : une dernière relecture avant que la version soit visible,
      # et c'est là que s'annonce un shapes_version ou un effects_version qui
      # change — l'événement le plus coûteux du projet.
      - name: Version en brouillon
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${titre}" \
            --draft \
            --notes-file notes.md \
            recu/*
