version: "2"

# misspell n'est pas dans la liste : ses dictionnaires sont anglais et il n'en
# existe pas de français. Sur ce dépôt il ne signale que des mots corrects —
# « connexion », « déplacements », `Enveloppe` — et le bruit finit par faire
# ignorer la sortie entière.
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic

  settings:
    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    rules:
      # Les corps sont encore des stubs : unused remonte les champs et les
      # fonctions que personne n'appelle. Retirer un chemin de cette liste dès
      # que son étape est écrite — 6 pour render, 9 et 10 pour ai, 13 pour le
      # bac à sable de loader.
      - linters:
          - unused
        path: internal/(core|render|loader|ai)/

      # executer ne renvoie pour l'instant qu'une erreur de stub, donc le test
      # qui suit son appel est toujours vrai et staticcheck le dit. À retirer à
      # l'étape 5, quand la boucle de jeu pourra rendre la main sans échouer.
      - linters:
          - staticcheck
        text: SA4023
        path: cmd/filature/main.go

formatters:
  enable:
    - gofmt
    - goimports
