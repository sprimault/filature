# Contenu livré avec le jeu. Ce fichier n'a aucun statut particulier : il est
# chargé par le même code qu'un plugin tiers, ce qui garantit que le chemin de
# chargement est exercé à chaque partie plutôt qu'une fois de temps en temps.

name = "base"
version = "0.1.0"
effects_version = 2
rules = true
license = "Apache-2.0"
description = "Capacités et dépenses de la règle standard"

# Le français est la langue de repli : un libellé absent d'une traduction est
# affiché depuis ici. Il vit donc dans le contenu de base plutôt que dans un
# plugin à part, où son absence rendrait l'interface muette.
[language]
code = "fr"
name = "Français"

# ---------------------------------------------------------------------------
# Capacités des inspecteurs : une par pion, une seule fois par partie.
# ---------------------------------------------------------------------------

[ability.lookout]
name = "Guetteur"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.lookout.effect]]
  type = "change_range"
  target = "current_piece"
  value = 8
  duration = 1

[ability.runner]
name = "Coureur"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.runner.effect]]
  type = "change_mobility"
  target = "current_piece"
  value = 1
  duration = 1

[ability.tracker]
name = "Traqueur"
side = "inspectors"
uses = 1
passive = true

  [[ability.tracker.effect]]
  type = "reveal_trails"
  target = "current_piece"
  radius = 2

[ability.blocker]
name = "Barreur"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.blocker.effect]]
  type = "block_cell"
  target = "cell"
  duration = 3

[ability.chief]
name = "Chef"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.chief.effect]]
  type = "share_view"
  target = "other_piece"
  duration = 2

# ---------------------------------------------------------------------------
# Dépenses de résistance du fugitif. Même format que les capacités : c'est le
# coût qui change de sens, pas la structure.
# ---------------------------------------------------------------------------

[expense.double_step]
name = "Double déplacement"
side = "fugitive"
cost = 2
trigger = "fugitive_phase"

  [[expense.double_step.effect]]
  type = "change_mobility"
  target = "fugitive"
  value = 1
  duration = 1

[expense.silence]
name = "Silence"
side = "fugitive"
cost = 3
trigger = "fugitive_phase"

  [[expense.silence.effect]]
  type = "cancel_reveal"
  target = "fugitive"

[expense.wipe_trails]
name = "Effacement"
side = "fugitive"
cost = 1
trigger = "fugitive_phase"

  [[expense.wipe_trails.effect]]
  type = "erase_trails"
  target = "fugitive"
  duration = 3

# Le fugitif ne change pas de zone par confort : l'étranglement peut fermer la
# sienne et l'y contraindre, et deux points sont alors une amende sur un plan
# qu'il n'a pas choisi d'abandonner.

[expense.change_zone]
name = "Changement de zone"
side = "fugitive"
cost = 2
trigger = "fugitive_phase"

  [[expense.change_zone.effect]]
  type = "seal_zone"
  target = "zone"

# Le meurtre se compose : révéler la position, marquer la scène, et payer. Les
# deux premiers restent distincts parce qu'ils ne durent pas pareil — la
# révélation vaut un tour, la scène reste sur le plateau.
#
# La convergence des inspecteurs n'est pas un effet : rien ne les oblige à se
# rendre sur la scène. C'est justement ce qui fait du meurtre un pari et non un
# automatisme.

[expense.murder]
name = "Meurtre"
side = "fugitive"
cost = 3
uses = 2
trigger = "fugitive_phase"

  [[expense.murder.effect]]
  type = "reveal_position"
  target = "fugitive"

  [[expense.murder.effect]]
  type = "mark_crime_scene"
  target = "fugitive"

# ---------------------------------------------------------------------------
# Modes : ce que le jeu déclenche de lui-même, sans qu'un joueur le choisisse.
# ---------------------------------------------------------------------------

# La fermeture progressive des zones d'extraction. Le préavis de deux tours est
# ici parce qu'il fait partie de la mécanique : les deux camps voient venir la
# fermeture, personne ne la subit par surprise.
#
# À partir de quel tour l'étranglement commence et tous les combien il se répète
# restent des paramètres de partie, réglables dans l'interface. Les inscrire ici
# donnerait deux sources de vérité, et un préréglage de difficulté n'aurait plus
# prise dessus.

[mode.strangling]
name = "Étranglement"
trigger = "strangling"

  [[mode.strangling.effect]]
  type = "defer"
  duration = 2
  announced = true

    [[mode.strangling.effect.then]]
    type = "close_zone"
    target = "zone"
