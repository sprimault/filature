# Contenu livré avec le jeu. Ce fichier n'a aucun statut particulier : il est
# chargé par le même code qu'un plugin tiers, ce qui garantit que le chemin de
# chargement est exercé à chaque partie plutôt qu'une fois de temps en temps.

name = "base"
version = "0.1.0"
effects_version = 3
rules = true
license = "Apache-2.0"
description = "Capacités et dépenses de la règle standard"

# Le français est la langue de repli : un libellé absent d'une traduction est
# affiché depuis ici. Il vit donc dans le contenu de base plutôt que dans un
# plugin à part, où son absence rendrait l'interface muette.
[language]
code = "fr"
name = "Français"

# ---------------------------------------------------------------------------
# Capacités des inspecteurs : une par pion, une seule fois par partie.
# ---------------------------------------------------------------------------

# La portée double, elle ne gagne pas huit cases : elle dérive de la taille du
# plateau, donc une valeur absolue dirait autre chose selon le préréglage. À 8
# en absolu, la capacité triplait la portée d'un Quartier.

[ability.lookout]
name = "Guetteur"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.lookout.effect]]
  type = "change_range"
  target = "current_piece"
  mode = "multiply"
  value = 2
  duration = 1

[ability.runner]
name = "Coureur"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.runner.effect]]
  type = "change_mobility"
  target = "current_piece"
  value = 1
  duration = 1

[ability.tracker]
name = "Traqueur"
side = "inspectors"
uses = 1
passive = true

  [[ability.tracker.effect]]
  type = "reveal_trails"
  target = "current_piece"
  radius = 2

[ability.blocker]
name = "Barreur"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.blocker.effect]]
  type = "block_cell"
  target = "cell"
  duration = 3

# Le Chef ordonne un coup de filet : la position du fugitif devient publique
# dans deux tours, et les deux camps le voient venir.
#
# La seule capacité d'information du camp, à côté de quatre capacités de
# terrain. Elle corrige une asymétrie : le fugitif a trois dépenses pour brouiller
# ce que les inspecteurs savent, eux n'avaient aucun moyen d'en acheter.
#
# Le préavis n'affaiblit pas le coup, il le rend jouable. Une révélation
# immédiate ne se contre pas — le Silence s'achète avant de savoir —, donc elle
# serait un couperet. Annoncée, elle force une décision : fuir, ou payer.
#
# Ici et non dans les paramètres, contrairement au préavis de l'étranglement :
# celui-là garantit qu'aucune fermeture ne surprend, c'est une règle du jeu.
# Celui-ci est ce que cette capacité-là décide de faire, et un plugin qui la
# remplace est libre d'en changer.

[ability.chief]
name = "Chef"
side = "inspectors"
uses = 1
trigger = "inspectors_phase"

  [[ability.chief.effect]]
  type = "defer"
  duration = 2
  announced = true

    [[ability.chief.effect.then]]
    type = "reveal_position"
    target = "fugitive"

# ---------------------------------------------------------------------------
# Dépenses de résistance du fugitif. Même format que les capacités : c'est le
# coût qui change de sens, pas la structure.
# ---------------------------------------------------------------------------

[expense.double_step]
name = "Double déplacement"
side = "fugitive"
cost = 2
trigger = "fugitive_phase"

  [[expense.double_step.effect]]
  type = "change_mobility"
  target = "fugitive"
  value = 1
  duration = 1

[expense.silence]
name = "Silence"
side = "fugitive"
cost = 3
trigger = "fugitive_phase"

  [[expense.silence.effect]]
  type = "cancel_reveal"
  target = "fugitive"

[expense.wipe_trails]
name = "Effacement"
side = "fugitive"
cost = 1
trigger = "fugitive_phase"

  [[expense.wipe_trails.effect]]
  type = "erase_trails"
  target = "fugitive"
  duration = 3

# Le fugitif ne change pas de zone par confort : l'étranglement peut fermer la
# sienne et l'y contraindre, et deux points sont alors une amende sur un plan
# qu'il n'a pas choisi d'abandonner.

[expense.change_zone]
name = "Changement de zone"
side = "fugitive"
cost = 2
trigger = "fugitive_phase"

  [[expense.change_zone.effect]]
  type = "seal_zone"
  target = "zone"

# Le leurre falsifie la trace du tour au lieu de l'effacer. Un point, trois fois
# par partie : moins cher que l'effacement d'un tour, parce qu'il en dit plus.
#
# Effacer laisse un trou, et un trou est une information — les inspecteurs
# savent qu'ils cherchent quelqu'un qui a payé. Une fausse trace ne se distingue
# pas d'une vraie, donc elle attaque la déduction elle-même plutôt que de la
# priver de matière.
#
# La case et la direction viennent du coup, pas d'ici : le joueur choisit où
# poser sa trace parmi ce que le terrain autorise.

[expense.decoy]
name = "Leurre"
side = "fugitive"
cost = 1
uses = 3
trigger = "fugitive_phase"

  [[expense.decoy.effect]]
  type = "decoy_trail"
  target = "cell"

# ---------------------------------------------------------------------------
# Modes : ce que le jeu déclenche de lui-même, sans qu'un joueur le choisisse.
# ---------------------------------------------------------------------------

# La fermeture progressive des zones d'extraction. Le mode ferme, rien de plus.
#
# Le préavis n'est pas ici : « personne ne la subit par surprise » est une règle
# du jeu, et une règle ne se négocie pas par manifeste — un plugin qui déclarait
# un préavis nul ne réglait pas le jeu, il en cassait une garantie. Le noyau
# l'annonce lui-même, deux tours avant de déclencher ce mode.
#
# À partir de quel tour l'étranglement commence et tous les combien il se répète
# restent des paramètres de partie, réglables dans l'interface. Les inscrire ici
# donnerait deux sources de vérité, et un préréglage de difficulté n'aurait plus
# prise dessus.

[mode.strangling]
name = "Étranglement"
trigger = "strangling"

  [[mode.strangling.effect]]
  type = "close_zone"
  target = "zone"
